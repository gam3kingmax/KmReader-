name: Build KmReader APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name km_reader --org com.km --platforms android .
          fi

      - name: Set compileSdk to 37
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/compileSdk(Version)?[ =]+.*/compileSdk = 37/' "$f"
              grep -n "compileSdk" "$f"
            fi
          done

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos || true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: KmReader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
