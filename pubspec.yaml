name: km_reader
description: KmReader - read, create, share and print PDF, Word, Excel, PPT and text files.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.1.0
  path_provider: ^2.1.4
  receive_sharing_intent: ^1.8.0

  syncfusion_flutter_pdfviewer: ^27.1.48
  docx_to_text: ^1.0.1
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0

  pdf: ^3.11.0
  docx_template: ^0.4.0

  share_plus: ^10.0.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
